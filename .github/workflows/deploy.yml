name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/auto-marketplace

            echo "==> Pulling latest changes..."
            git pull origin main

            echo "==> Creating .env files if not exist..."
            # Backend .env
            if [ ! -f backend/.env ]; then
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > backend/.env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
              echo "PORT=8080" >> backend/.env
              echo "CORS_ORIGIN=http://${{ secrets.VPS_HOST }}" >> backend/.env
              echo "Created backend/.env"
            fi

            # Frontend .env
            if [ ! -f frontend/.env ]; then
              echo "NEXT_PUBLIC_API_BASE=http://${{ secrets.VPS_HOST }}" > frontend/.env
              echo "Created frontend/.env"
            fi

            echo "==> Installing backend dependencies..."
            cd backend
            npm ci --production

            echo "==> Installing frontend dependencies and building..."
            cd ../frontend
            npm ci
            npm run build

            echo "==> Restarting PM2 apps..."
            cd ..
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save

            echo "==> Deploy completed successfully!"
